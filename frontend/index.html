<!doctype html>
<html lang="en" class="light" data-accent="sky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLens AI — AI-Powered GitHub Repository Analyzer</title>
    <meta name="description" content="Explore unfamiliar GitHub repositories, understand project architecture, inspect source files, and get source-grounded explanations with AI." />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'></circle><line x1='21' y1='21' x2='16.65' y2='16.65'></line><path d='m8 11 2 2 4-4'></path></svg>" />
    <script>
      (function() {
        try {
          const accent = localStorage.getItem('devlens_accent_palette') || 'sky';
          document.documentElement.setAttribute('data-accent', accent);
          const theme = localStorage.getItem('devlens_theme') || 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-sky-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
